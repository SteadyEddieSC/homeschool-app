name: AUTH-FOUNDATION-001 bootstrap

on:
  push:
    branches:
      - feature/auth-foundation-001-better-auth
    paths:
      - 'v11/package.json'
      - 'v11/package-lock.json'
      - 'v11/cloudflare-proof/auth.ts'
      - 'v11/cloudflare-proof/auth-worker.ts'
      - 'v11/cloudflare-proof/auth.test.ts'
      - 'v11/cloudflare-proof/migrations/0002_better_auth.sql'
      - '.github/workflows/auth-foundation-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: auth-foundation-001-bootstrap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic dependency lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Install exact candidate dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck the auth adapter and accepted D1 boundary
        run: npm run auth:proof:typecheck
      - name: Run bounded local Better Auth + D1 proof
        run: npm run auth:proof
      - name: Re-run accepted household/co-op D1 regression proof
        run: npm run d1:proof
      - name: Commit only the generated lockfile
        working-directory: .
        run: |
          git add v11/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AUTH-FOUNDATION-001: lock reviewed auth dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}
