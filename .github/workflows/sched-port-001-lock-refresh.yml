name: SCHED-PORT-001 lock refresh

on:
  push:
    branches:
      - feature/sched-port-001-planner-parity
    paths:
      - 'v11/package.json'
      - 'v11/package-lock.json'
      - 'v11/src/domain/family-planner.ts'
      - 'v11/src/domain/family-planner.test.ts'
      - '.github/workflows/sched-port-001-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sched-port-001-planner-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Refresh deterministic v11 lock
        working-directory: v11
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove locked install
        working-directory: v11
        run: npm ci
      - name: Prove planner parity and strict TypeScript
        working-directory: v11
        run: |
          npm run test:planner
          npm run typecheck
      - name: Require clean high-severity audit
        working-directory: v11
        run: npm audit --audit-level=high
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- v11/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v11/package-lock.json
          git commit -m 'SCHED-PORT-001: refresh planner parity lock'
          git push origin HEAD:feature/sched-port-001-planner-parity
