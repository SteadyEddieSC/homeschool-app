name: Deploy v11 Preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the exact deployment confirmation phrase
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - DEPLOY_V11_PREVIEW

concurrency:
  group: deploy-v11-preview
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_V11_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: v11-preview
    defaults:
      run:
        working-directory: v11
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_APP_ENV: preview
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      V11_PREVIEW_URL: ${{ vars.V11_PREVIEW_URL }}
      PILOT_TEST_EMAIL: ${{ secrets.PILOT_TEST_EMAIL }}
      PILOT_TEST_PASSWORD: ${{ secrets.PILOT_TEST_PASSWORD }}
      EXPECTED_WORKER_NAME: beaufort-learning-harbor-v11-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact preview dependencies
        run: npm install --no-package-lock
      - name: Validate source, migration rehearsal, readiness evidence, and build
        run: npm run verify
      - name: Validate protected provider configuration
        run: npm run pilot:doctor
      - name: Validate protected deployment boundary
        run: npm run check:deploy-readiness
      - name: Verify migrations 001-010 on the non-production Supabase project
        run: npm run pilot:verify-schema
      - name: Deploy isolated v11 preview Worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify deployed health boundary
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "${V11_PREVIEW_URL%/}/api/health" --output deployment-health.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const health = JSON.parse(await readFile('deployment-health.json', 'utf8'));
          if (health.ok !== true) throw new Error('Preview health endpoint did not return ok=true');
          if (health.release !== '11.0.0-rc.1') throw new Error(`Unexpected deployed release: ${health.release}`);
          if (health.service !== process.env.EXPECTED_WORKER_NAME) throw new Error(`Unexpected Worker service: ${health.service}`);
          NODE
      - name: Verify release-candidate capability boundary
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "${V11_PREVIEW_URL%/}/api/config" --output deployment-config.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('deployment-config.json', 'utf8'));
          if (config.productionDataEnabled !== false) throw new Error('Preview must not enable production data');
          if (config.learning?.deterministicObjectiveScoring !== true || config.learning?.explicitEvidenceReview !== true) throw new Error('Learning authority boundaries are missing');
          if (config.learning?.automaticGrades !== false || config.learning?.automaticMastery !== false || config.learning?.automaticAttendance !== false || config.learning?.automaticXp !== false) throw new Error('Automatic outcomes must remain disabled');
          if (config.resilience?.orderedMutationQueue !== true || config.resilience?.clientRecordIdsPreserved !== true || config.resilience?.conflictAwareStudioReconciliation !== true || config.resilience?.silentConflictOverwrite !== false) throw new Error('Synchronization boundaries are missing');
          if (config.migration?.syntheticV1043Rehearsal !== true || config.migration?.strictParser !== true || config.migration?.liveMigrationEnabled !== false || config.migration?.productionWriteEnabled !== false) throw new Error('Migration rehearsal boundaries are missing');
          if (config.readiness?.decision !== 'not-ready' || config.readiness?.productionReady !== false || config.readiness?.productionCutover !== false || config.readiness?.automatedPromotionAllowed !== false) throw new Error('Readiness must remain owner-blocked');
          if (config.hostedPilot?.automaticDeployment !== false || config.hostedPilot?.providerActivationRequired !== true) throw new Error('Provider activation boundary is missing');
          NODE
      - name: Create sanitized deployment receipt
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const health = JSON.parse(await readFile('deployment-health.json', 'utf8'));
          const configuration = JSON.parse(await readFile('deployment-config.json', 'utf8'));
          const schema = JSON.parse(await readFile('remote-schema-report.json', 'utf8'));
          const doctor = JSON.parse(await readFile('pilot-doctor-report.json', 'utf8'));
          const receipt = {
            schema: 'beaufort-learning-harbor-v11-preview-deployment-receipt-v2',
            release: '11.0.0-rc.1',
            worker: process.env.EXPECTED_WORKER_NAME,
            previewHost: new URL(process.env.V11_PREVIEW_URL).hostname,
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            deployedAt: new Date().toISOString(),
            health,
            migration: configuration.migration,
            recovery: configuration.recovery,
            readiness: configuration.readiness,
            hostedPilot: configuration.hostedPilot,
            remoteSchema: schema,
            doctor: { ready: doctor.ready, hosts: doctor.hosts, migrations: doctor.migrations, productionCutoverApproved: false },
            exclusions: ['credentials and sessions', 'learner names and work', 'queue payloads', 'raw error text']
          };
          await writeFile('deployment-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
      - name: Validate and summarize RC.2 provider evidence
        run: npm run rc2:evidence:provider
      - name: Upload sanitized deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: beaufort-learning-harbor-v11.0.0-rc.1-deployment-receipt
          path: |
            v11/deployment-health.json
            v11/deployment-config.json
            v11/deployment-receipt.json
            v11/pilot-doctor-report.json
            v11/remote-schema-report.json
            v11/test-results/rc2/rc2-provider-evidence.json
          if-no-files-found: error
          retention-days: 90
