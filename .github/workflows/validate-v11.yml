name: Validate v11

on:
  pull_request:
    branches: [main]
    paths:
      - 'v11/**'
      - 'docs/v11/**'
      - '.github/ISSUE_TEMPLATE/v11-rc2-hosted-pilot-defect.yml'
      - '.github/workflows/validate-v11.yml'
      - '.github/workflows/deploy-v11-preview.yml'
      - '.gitignore'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'v11/**'
      - 'docs/v11/**'
      - '.github/ISSUE_TEMPLATE/v11-rc2-hosted-pilot-defect.yml'
      - '.github/workflows/validate-v11.yml'
      - '.github/workflows/deploy-v11-preview.yml'
      - '.gitignore'
      - 'README.md'

concurrency:
  group: validate-v11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run verify
      - name: Verify unconfigured pilot doctor fails safely
        run: |
          set +e
          npm run pilot:doctor
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected missing-provider exit code 2, received $code"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('pilot-doctor-report.json','utf8'));
          if (report.release !== '11.0.0-rc.1') throw new Error('Unexpected pilot doctor release');
          if (report.ready !== false || report.productionCutoverApproved !== false) throw new Error('Unconfigured rc.1 must remain blocked');
          if (!Array.isArray(report.missing) || report.missing.length === 0) throw new Error('Missing provider configuration was not reported');
          if (!Array.isArray(report.unsafe) || report.unsafe.length !== 0) throw new Error('Unconfigured CI should be missing, not unsafe');
          if (report.migrations?.latest !== '202608050010_v11_hosted_acl_hardening.sql') throw new Error('Migration 010 was not detected');
          if (report.migrations?.releaseCandidate !== '202608040009_v11_migration_rehearsal.sql') throw new Error('Migration 009 release-candidate evidence was not detected');
          const text = JSON.stringify(report).toLowerCase();
          for (const forbidden of ['password', 'service_role', 'sb_secret_', 'access_token']) if (text.includes(forbidden)) throw new Error(`Pilot doctor leaked forbidden material: ${forbidden}`);
          NODE
      - name: Upload sanitized rc.1 and RC.2 foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: v11-rc1-migration-rehearsal
          path: |
            v11/test-results/rc1/migration-rehearsal-report.json
            v11/test-results/rc1/production-readiness-report.json
            v11/test-results/rc1/vendor-exit-rehearsal-report.json
            v11/test-results/rc2/rc2-repository-evidence.json
            v11/pilot-doctor-report.json
          if-no-files-found: error
          retention-days: 30

  database:
    runs-on: ubuntu-latest
    needs: foundation
    timeout-minutes: 25
    defaults:
      run:
        working-directory: v11
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Start local Supabase stack
        run: npm run db:start
      - name: Rebuild database from migrations 001-010
        run: npm run db:reset
      - name: Run identity, family, studio, hosted-pilot, ACL, migration, idempotency, audit, and RLS tests
        run: npm run db:test
      - name: Stop local Supabase stack
        if: always()
        run: npm run db:stop

  browser:
    name: browser-${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: foundation
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-tablet, chromium-mobile]
    defaults:
      run:
        working-directory: v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload v11 rc.1 Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-rc1-playwright-${{ matrix.project }}
          path: |
            v11/playwright-report/
            v11/test-results/
          if-no-files-found: ignore
          retention-days: 14

  preview-artifact:
    runs-on: ubuntu-latest
    needs: [database, browser]
    defaults:
      run:
        working-directory: v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run verify
      - name: Upload validated rc.1 preview build
        uses: actions/upload-artifact@v4
        with:
          name: beaufort-learning-harbor-v11.0.0-rc.1-preview
          path: v11/dist/
          if-no-files-found: error
          retention-days: 30
