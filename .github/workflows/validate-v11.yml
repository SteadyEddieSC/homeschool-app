name: Validate v11
on:
  pull_request:
    branches: [main]
    paths: ['v11/**','docs/v11/**','.github/workflows/validate-v11.yml','.github/workflows/deploy-v11-preview.yml','.gitignore','README.md']
  push:
    branches: [main]
    paths: ['v11/**','docs/v11/**','.github/workflows/validate-v11.yml','.github/workflows/deploy-v11-preview.yml','.gitignore','README.md']
concurrency:
  group: validate-v11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: v11 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-package-lock
      - run: npm run verify
      - name: Verify unconfigured pilot doctor fails safely
        run: |
          set +e
          npm run pilot:doctor
          code=$?
          set -e
          test "$code" -eq 2
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('pilot-doctor-report.json','utf8'));
          if (report.release !== '11.0.0-rc.1' || report.ready !== false || report.productionCutoverApproved !== false) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v11-rc1-migration-rehearsal
          path: |
            v11/artifacts/rc1/
            v11/pilot-doctor-report.json
          if-no-files-found: error
          retention-days: 30
  database:
    runs-on: ubuntu-latest
    needs: foundation
    timeout-minutes: 25
    defaults: { run: { working-directory: v11 } }
    env: { SUPABASE_TELEMETRY_DISABLED: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-package-lock
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - if: always()
        run: npm run db:stop
  browser:
    name: browser-${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: foundation
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { project: [chromium-desktop, chromium-tablet, chromium-mobile] }
    defaults: { run: { working-directory: v11 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-rc1-playwright-${{ matrix.project }}
          path: |
            v11/playwright-report/
            v11/test-results/
          if-no-files-found: ignore
          retention-days: 14
  preview-artifact:
    runs-on: ubuntu-latest
    needs: [database, browser]
    defaults: { run: { working-directory: v11 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-package-lock
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: beaufort-learning-harbor-v11.0.0-rc.1-preview
          path: v11/dist/
          if-no-files-found: error
          retention-days: 30
