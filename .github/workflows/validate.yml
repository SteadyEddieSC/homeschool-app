name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run verify

  browser:
    name: browser-${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: foundation
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-tablet, chromium-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run verify:release
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-artifact:
    runs-on: ubuntu-latest
    needs: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:release
      - name: Stage downloadable release
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, copyFile, readFile, writeFile } from 'node:fs/promises';
          const current = JSON.parse(await readFile('source/current-release.json', 'utf8'));
          const manifest = JSON.parse(await readFile(current.manifest, 'utf8'));
          const checksumName = `${manifest.downloadName}.sha256.txt`;
          await copyFile(manifest.output, manifest.downloadName);
          await writeFile(checksumName, `${manifest.sha256}  ${manifest.downloadName}\n`, 'utf8');
          await appendFile(process.env.GITHUB_OUTPUT, `download_name=${manifest.downloadName}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `checksum_name=${checksumName}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `artifact_name=beaufort-learning-harbor-${manifest.release}\n`);
          NODE
      - name: Upload validated single-file release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            ${{ steps.release.outputs.download_name }}
            ${{ steps.release.outputs.checksum_name }}
          if-no-files-found: error
          retention-days: 30
