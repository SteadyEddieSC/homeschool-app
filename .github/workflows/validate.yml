name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run verify

  browser:
    name: browser-${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: foundation
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-tablet, chromium-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run verify:release
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-artifact:
    runs-on: ubuntu-latest
    needs: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:release
      - name: Stage downloadable release
        run: cp site/index.html beaufort_learning_harbor_v10_34_1.html
      - name: Upload validated single-file release
        uses: actions/upload-artifact@v4
        with:
          name: beaufort-learning-harbor-v10.34.1
          path: beaufort_learning_harbor_v10_34_1.html
          if-no-files-found: error
          retention-days: 30
